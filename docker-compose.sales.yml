# Ponte Sales & Associados ↔ DeskcommCRM. Sobe SOZINHA (projeto à parte) e entra na rede `caddy-sites` do Deskcomm,
# o ponto de extensão oficial dele: o Caddy do Deskcomm publica a ponte com HTTPS, sem editar nenhum arquivo do Deskcomm.
#
#   cd ~/lexsync
#   cp sales-bridge/.env.example sales-bridge/.env   # e preencha
#   CADDY_SITES_NETWORK=$(docker network ls --format '{{.Name}}' | grep caddy-sites) docker compose -f docker-compose.sales.yml up -d --build
services:
  sales-bridge:
    build: ./sales-bridge
    restart: unless-stopped
    env_file: ./sales-bridge/.env
    mem_limit: 256m
    networks: [caddy-sites]
networks:
  caddy-sites:
    external: true
    name: ${CADDY_SITES_NETWORK:?rode o comando como está no cabeçalho deste arquivo}
